repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Scenario fixtures hold listed fakes; verify-fakes checks them instead.
        exclude: uv\.lock|^scenarios/

  - repo: local
    hooks:
      - id: verify-fakes
        name: Verify scenario fakes
        # Fails on any detected secret in scenarios/ that isn't in FAKE_SECRETS.txt.
        entry: uv run spangloss scenarios verify-fakes
        language: system
        files: ^scenarios/
