receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop account identity before anything is written. user.id and session.id stay.
  attributes/strip_identity:
    actions:
      - key: user.email
        action: delete
      - key: user.account_uuid
        action: delete
      - key: user.account_id
        action: delete
      - key: organization.id
        action: delete
  batch:

exporters:
  # One OTLP JSON export request per line; each line can hold many spans.
  file:
    path: /data/raw/traces.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 100
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip_identity, batch]
      exporters: [file, otlp/jaeger]
