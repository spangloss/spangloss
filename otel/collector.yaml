receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # One OTLP JSON export request per line; each line can hold many spans.
  file:
    path: /data/raw/traces.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 100
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, otlp/jaeger]
